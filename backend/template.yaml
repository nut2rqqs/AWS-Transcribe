AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Transcribe web backend with queued transcription and Thai subtitle completion.
Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Set to the deployed CloudFront website origin before production.
Resources:
  WebApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: ['content-type','authorization']
        AllowMethods: [GET,POST,OPTIONS]
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ['*']
            MaxAge: 3000
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1080
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
          JOBS_QUEUE_URL: !Ref JobsQueue
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt JobsQueue.QueueName }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebApi
            Path: /{proxy+}
            Method: ANY
  TranscribeWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/worker.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      ReservedConcurrentExecutions: 1
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - Statement:
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob]
              Resource: '*'
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
  TranscribeCompletion:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/completion.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - Statement:
            - Effect: Allow
              Action: [transcribe:GetTranscriptionJob]
              Resource: '*'
            - Effect: Allow
              Action: [translate:TranslateText]
              Resource: '*'
      Events:
        TranscribeStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.transcribe]
              detail-type: [Transcribe Job State Change]
              detail:
                TranscriptionJobStatus: [COMPLETED, FAILED]
Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com'
  UploadBucketName:
    Value: !Ref UploadBucket
  JobsTableName:
    Value: !Ref JobsTable
  JobsQueueUrl:
    Value: !Ref JobsQueue
