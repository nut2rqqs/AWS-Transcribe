AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Transcribe web backend foundation (private uploads, job API, serialized Transcribe queue).
Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Set to the deployed CloudFront website origin before production.
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-web'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  WebApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: ['content-type','authorization']
        AllowMethods: [GET,POST,OPTIONS]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ['*']
            MaxAge: 3000
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1080
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
          JOBS_QUEUE_URL: !Ref JobsQueue
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt JobsQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: [transcribe:GetTranscriptionJob]
              Resource: '*'
            - Effect: Allow
              Action: [translate:TranslateText]
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebApi
            Path: /{proxy+}
            Method: ANY
  TranscribeWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/worker.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      ReservedConcurrentExecutions: 1
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - Statement:
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob]
              Resource: '*'
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
Outputs:
  CognitoUserPoolId:
    Description: Cognito user pool ID for frontend authentication
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Cognito app client ID for frontend authentication
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com'
  UploadBucketName:
    Value: !Ref UploadBucket
  JobsTableName:
    Value: !Ref JobsTable
  JobsQueueUrl:
    Value: !Ref JobsQueue
