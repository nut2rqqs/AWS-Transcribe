AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Transcribe web backend foundation (private uploads, job API, serialized Transcribe queue).
Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Set to the deployed CloudFront website origin before production.
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        UPLOAD_BUCKET: !Ref UploadBucket
        JOBS_QUEUE_URL: !Ref JobsQueue
        ALLOWED_ORIGIN: !Ref AllowedOrigin
Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ['*']
            MaxAge: 3000
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api.handler
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket
          JOBS_QUEUE_URL: !Ref JobsQueue
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt JobsQueue.QueueName }
      Events:
        Api:
          Type: HttpApi
          Properties:
            CorsConfiguration:
              AllowOrigins: [!Ref AllowedOrigin]
              AllowHeaders: ['content-type','authorization']
              AllowMethods: [GET,POST,OPTIONS]
  TranscribeWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/worker.handler
      ReservedConcurrentExecutions: 1
      Timeout: 180
      Policies:
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }
        - S3WritePolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - Statement:
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
              Resource: '*'
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  UploadBucketName:
    Value: !Ref UploadBucket
  JobsTableName:
    Value: !Ref JobsTable
  JobsQueueUrl:
    Value: !Ref JobsQueue
