name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-transcribe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install
      - name: Build web app
        run: npm run build

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm install
      - name: Check backend syntax
        run: npm run check
      - name: Run backend tests
        run: npm test

  sam:
    name: AWS SAM template validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Validate infrastructure template
        run: sam validate --lint --template-file backend/template.yaml
